recording:
  max_bag_size_mb: 500
  base_path: "data/bags"

  profiles:
    # All streams
    full_capture:
      topics:
        # LiDAR topics
        - topic: "/voyant/device_metadata"
          bag_name: "lidar"
        - topic: "/voyant/point_cloud"
          bag_name: "lidar"
        # Metadata topics
        - topic: "/tf_static"
          bag_name: "metadata"
        # RGB camera
        - topic: "/camera/rgb/image_raw/compressed"
          bag_name: "rgb_camera"
        - topic: "/camera/rgb/camera_info"
          bag_name: "rgb_camera"
        # Stereo cameras
        - topic: "/camera/left/image_raw/compressed"
          bag_name: "stereo_cameras"
        - topic: "/camera/right/image_raw/compressed"
          bag_name: "stereo_cameras"
        - topic: "/camera/left/camera_info"
          bag_name: "stereo_cameras"
        - topic: "/camera/right/camera_info"
          bag_name: "stereo_cameras"
        # Navigation topics (GPS + IMU)
        # GPS topics
        - topic: "/gps/fix"
          bag_name: "navigation"
        - topic: "/gps/navcov"
          bag_name: "navigation"
        - topic: "/gps/navpvt"
          bag_name: "navigation"
        - topic: "/gps/navstatus"
          bag_name: "navigation"
        - topic: "/gps/navrelposned"
          bag_name: "navigation"
        - topic: "/gps/fix_velocity"
          bag_name: "navigation"
        - topic: "/gps/nmea"
          bag_name: "navigation"
        - topic: "/gps/rtcm"
          bag_name: "navigation"
        # VectorNav IMU topics
        - topic: "/vectornav/gnss"
          bag_name: "navigation"
        - topic: "/vectornav/imu"
          bag_name: "navigation"
        - topic: "/vectornav/imu_uncompensated"
          bag_name: "navigation"
        - topic: "/vectornav/pose"
          bag_name: "navigation"
        - topic: "/vectornav/raw/ins"
          bag_name: "navigation"
        - topic: "/vectornav/time_gps"
          bag_name: "navigation"
        - topic: "/vectornav/velocity_body"
          bag_name: "navigation"

    lidar_only:
      topics:
        - topic: "/voyant/device_metadata"
          bag_name: "lidar"
        - topic: "/voyant/point_cloud"
          bag_name: "lidar"
        - topic: "/tf_static"
          bag_name: "metadata"

    gps_only:
      topics:
        - topic: "/gps/fix"
          bag_name: "navigation"
        - topic: "/gps/navcov"
          bag_name: "navigation"
        - topic: "/gps/navpvt"
          bag_name: "navigation"
        - topic: "/gps/navstatus"
          bag_name: "navigation"
        - topic: "/gps/navrelposned"
          bag_name: "navigation"
        - topic: "/gps/fix_velocity"
          bag_name: "navigation"
        - topic: "/gps/nmea"
          bag_name: "navigation"
        - topic: "/gps/rtcm"
          bag_name: "navigation"
