# Configuration Settings for ZED F9P
ublox_gps_node:
  ros__parameters:
    debug: 1                    # Range 0-4 (0 means no debug statements will print)
    device: /dev/ttyACM0
    frame_id: gps
    uart1:
      baudrate: 115200
    
    # TMODE3 Config
    tmode3: 0                   # Survey-In Mode
    sv_in:
      reset: True               # True: disables and re-enables survey-in (resets)
                                # False: Disables survey-in only if TMODE3 is
                                # disabled
      min_dur: 300              # Survey-In Minimum Duration [s]
      acc_lim: 3.0              # Survey-In Accuracy Limit [m]

    inf:
      all: true                   # Whether to display all INF messages in console
    
    publish:
      all: true
      aid:
        hui: false
      nav:
        posecef: false

# Ntrip Config
ntrip_client_config:
  ros__parameters:
    host: 'rtn.dot.ny.gov'
    port: '8082'
    mountpoint: 'NYGC' # Other possible mountpoints near 40th Street are NJ12, NYBR but are unable to connect
    username: 'mewaday'
    password: 'LidarInNYC275'

    # These are default values, but can be changed if needed
    node_name: 'ntrip_client'
    namespace: '/'
    debug: 'true'
    authenticate: 'True'
    ssl: 'False'
    rtcm_message_package: 'rtcm_msgs'
    cert: 'None'
    key: 'None'
    ca_cert: 'None'